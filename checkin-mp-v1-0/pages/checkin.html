<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>打卡页 - 打卡小程序 原型</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body>
  <div class="phone-frame" style="padding-bottom:96px">
    <div class="nav-bar">
      <a class="nav-bar__back" href="javascript:history.back()">‹ 返回</a>
      <span class="nav-bar__title">阅读 30 分钟</span>
      <span style="width:48px"></span>
    </div>

    <!-- 打卡表单（默认） -->
    <div data-state-not="success">
      <div class="streak">
        <div class="muted">当前连续打卡</div>
        <div class="streak__num">2<span style="font-size:18px"> 天</span></div>
        <div class="streak__label">今天打卡后将达到 3 天 · 11月6日 周五</div>
      </div>

      <div class="field">
        <div class="field__label"><span>今日心得（选填）</span><span>26 / 200</span></div>
        <div class="textarea">读完《小狗钱钱》第三章，理解了先存后花的道理。</div>
      </div>

      <div class="field">
        <div class="field__label"><span>添加图片（选填）</span><span>1 / 3</span></div>
        <div class="photos">
          <div class="photo">🖼</div>
          <div class="photo photo--add">＋</div>
        </div>
      </div>

      <div class="sticky-bottom">
        <div class="btn btn--primary" data-go="checkin.html?s=success">完成打卡</div>
      </div>
    </div>

    <!-- 打卡成功（?s=success） -->
    <div data-state="success">
      <div class="success-box">
        <div class="success-box__ic">✓</div>
        <div class="h1">打卡成功</div>
        <p class="muted" style="margin-top:8px">已连续打卡 3 天，今日 2 / 3 个任务完成</p>
      </div>
      <div class="kpis">
        <div class="kpi"><b>3</b><span>当前连续（天）</span></div>
        <div class="kpi"><b>9</b><span>最长连续（天）</span></div>
        <div class="kpi"><b>23</b><span>累计打卡（天）</span></div>
      </div>
      <div class="pad" style="margin-top:var(--spacing-lg)">
        <div class="sheet-btns">
          <a class="btn btn--primary" href="task-detail.html">查看任务详情</a>
          <a class="btn btn--ghost" href="home.html" data-flow-ignore>返回首页</a>
        </div>
      </div>
    </div>

    <!-- 里程碑达成弹窗 -->
    <div class="modal-overlay center" id="milestone">
      <div class="modal-content" style="border-radius:26px;margin:0 32px;text-align:center">
        <div class="badge__ic" style="width:84px;height:84px;font-size:44px;margin:0 auto var(--spacing-md)">🔥</div>
        <div class="sheet-title">获得徽章「三天打鱼」</div>
        <p class="sheet-sub">你已连续打卡 3 天，习惯正在养成！<br>徽章已放入「我的徽章」</p>
        <div class="sheet-btns">
          <div class="btn btn--primary" data-close>太棒了</div>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/interaction.js"></script>
</body>
</html>
