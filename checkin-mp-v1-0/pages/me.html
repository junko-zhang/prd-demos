<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的页 - 打卡小程序 原型</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body>
  <div class="phone-frame pb-tab">
    <div class="nav-bar">
      <span class="h2">我的</span>
      <span style="width:48px"></span>
    </div>

    <div class="profile">
      <div class="avatar">🐻</div>
      <div class="grow">
        <div class="h2">小林</div>
        <div class="muted mt-4">已加入 38 天 · 累计打卡 96 次</div>
      </div>
    </div>

    <div class="cell-group">
      <a class="cell" href="task-manage.html"><span>📋 任务管理</span><span class="cell__v">进行中 3 个 ›</span></a>
      <div class="cell"><span>🔔 打卡提醒</span><span class="switch on"></span></div>
      <div class="cell"><span>🌙 免打扰时段</span><span class="cell__v">23:00 - 06:00 ›</span></div>
    </div>

    <div class="cell-group">
      <div class="cell"><span>💬 意见反馈</span><span class="cell__v">›</span></div>
      <div class="cell"><span>ℹ️ 关于每日打卡</span><span class="cell__v">v1.0.0 ›</span></div>
    </div>

    <div class="tab-bar">
      <a class="tab-bar__item" href="home.html"><span>🏠</span>首页</a>
      <a class="tab-bar__item" href="stats.html"><span>📊</span>统计</a>
      <a class="tab-bar__item active" href="me.html"><span>👤</span>我的</a>
    </div>
  </div>
  <script src="../assets/interaction.js"></script>
</body>
</html>
