<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>首页 - 打卡小程序 原型</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body>
  <div class="phone-frame pb-tab">
    <div class="nav-bar">
      <span class="h2">打卡</span>
      <a class="nav-bar__action text-primary" href="task-create.html" style="text-decoration:none">＋ 新建</a>
    </div>

    <div class="pad" style="padding-bottom:var(--spacing-md)">
      <div class="h1">早上好，小林</div>
      <div class="muted mt-4">11月6日 周五</div>
    </div>

    <!-- 有任务（默认） -->
    <div data-state-not="empty">
      <div class="hero">
        <div class="hero__top">
          <div class="hero__title">今日进度 1 / 3</div>
          <span class="tag" style="background:rgba(255,255,255,.25);color:var(--color-text-white)">🔥 最长连续 21 天</span>
        </div>
        <div class="hero__sub">再完成 2 个任务，今天就圆满了</div>
        <div class="hero__progress"><i style="width:33%"></i></div>
      </div>

      <div class="section-title"><span class="h2">今日任务</span><span class="muted">按提醒时间排序</span></div>

      <div class="task task--done">
        <a class="row grow" style="gap:12px;text-decoration:none;color:inherit" href="task-detail.html">
          <div class="task__icon">⏰</div>
          <div class="grow">
            <div class="task__name">早起</div>
            <div class="task__meta">06:30 · 每天 · 连续 21 天</div>
          </div>
        </a>
        <span class="go-btn go-btn--done">已打卡</span>
      </div>

      <div class="task">
        <a class="row grow" style="gap:12px;text-decoration:none;color:inherit" href="task-detail.html">
          <div class="task__icon">📖</div>
          <div class="grow">
            <div class="task__name">阅读 30 分钟</div>
            <div class="task__meta">21:00 · 每天 · 连续 2 天</div>
          </div>
        </a>
        <a class="go-btn" href="checkin.html">打卡</a>
      </div>

      <div class="task">
        <div class="task__icon">🔤</div>
        <div class="grow">
          <div class="task__name">背 20 个单词</div>
          <div class="task__meta">22:00 · 周一至周五 · 连续 5 天</div>
        </div>
        <a class="go-btn" href="checkin.html">打卡</a>
      </div>

      <p class="muted text-center" style="margin-top:var(--spacing-lg)">最多可同时进行 10 个任务，当前 3 / 10</p>
    </div>

    <!-- 空态（?s=empty） -->
    <div data-state="empty">
      <div class="empty-state" style="padding-top:64px">
        <div class="empty-state__icon">🌱</div>
        <div class="empty-state__text">还没有打卡任务<br>从一个小习惯开始吧，比如每天早起或阅读</div>
      </div>
      <div class="pad" style="margin-top:var(--spacing-lg)">
        <a class="btn btn--primary" href="task-create.html">创建第一个任务</a>
      </div>
    </div>

    <div class="tab-bar">
      <a class="tab-bar__item active" href="home.html"><span>🏠</span>首页</a>
      <a class="tab-bar__item" href="stats.html"><span>📊</span>统计</a>
      <a class="tab-bar__item" href="me.html"><span>👤</span>我的</a>
    </div>
  </div>
  <script src="../assets/interaction.js"></script>
</body>
</html>
