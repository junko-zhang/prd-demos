<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的徽章页 - 打卡小程序 原型</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body>
  <div class="phone-frame" style="padding-bottom:24px">
    <div class="nav-bar">
      <a class="nav-bar__back" href="javascript:history.back()">‹ 返回</a>
      <span class="nav-bar__title">我的徽章</span>
      <span style="width:48px"></span>
    </div>

    <div class="pad" style="padding-bottom:var(--spacing-md)">
      <div class="h1">4 / 9</div>
      <div class="muted mt-4">连续打卡和累计打卡达到里程碑，就能解锁徽章</div>
    </div>

    <div class="badge-grid">
      <div class="badge"><div class="badge__ic">🌱</div><div class="badge__n">起步</div><div class="badge__d">创建第一个任务</div></div>
      <div class="badge"><div class="badge__ic">🔥</div><div class="badge__n">三天打鱼</div><div class="badge__d">连续打卡 3 天</div></div>
      <div class="badge"><div class="badge__ic">⭐</div><div class="badge__n">一周达人</div><div class="badge__d">连续打卡 7 天</div></div>
      <div class="badge"><div class="badge__ic">🌙</div><div class="badge__n">习惯养成</div><div class="badge__d">连续打卡 21 天</div></div>
      <div class="badge badge--lock"><div class="badge__ic">🏆</div><div class="badge__n">五十不倦</div><div class="badge__d">连续打卡 50 天</div></div>
      <div class="badge badge--lock"><div class="badge__ic">👑</div><div class="badge__n">百日传奇</div><div class="badge__d">连续打卡 100 天</div></div>
      <div class="badge badge--lock"><div class="badge__ic">📅</div><div class="badge__n">三十次</div><div class="badge__d">累计打卡 30 次</div></div>
      <div class="badge badge--lock"><div class="badge__ic">💎</div><div class="badge__n">百次打卡</div><div class="badge__d">累计打卡 100 次</div></div>
      <div class="badge badge--lock"><div class="badge__ic">🔄</div><div class="badge__n">知错就改</div><div class="badge__d">完成首次补卡</div></div>
    </div>
  </div>
  <script src="../assets/interaction.js"></script>
</body>
</html>
