<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>数据统计页 - 打卡小程序 原型</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body>
  <div class="phone-frame pb-tab">
    <div class="nav-bar">
      <span class="h2">统计</span>
      <span style="width:48px"></span>
    </div>

    <div class="pad" data-tabs>
      <div class="tabs" style="margin-bottom:var(--spacing-md)">
        <div class="tabs__item active" data-tab="week">本周</div>
        <div class="tabs__item" data-tab="month">本月</div>
      </div>

      <div data-panel="week">
        <div class="kpis" style="margin:0 0 var(--spacing-md)">
          <div class="kpi"><b>87%</b><span>本周完成率</span></div>
          <div class="kpi"><b>13</b><span>本周打卡（次）</span></div>
          <div class="kpi"><b>21</b><span>最长连续（天）</span></div>
        </div>

        <div class="card" style="margin:0 0 var(--spacing-md)">
          <div class="card__title">每日完成数</div>
          <div class="bars">
            <div><i style="height:90px"></i>一</div>
            <div><i style="height:60px"></i>二</div>
            <div><i style="height:90px"></i>三</div>
            <div><i style="height:90px"></i>四</div>
            <div><i style="height:60px"></i>五</div>
            <div><i class="low" style="height:6px"></i>六</div>
            <div><i class="low" style="height:6px"></i>日</div>
          </div>
        </div>

        <div class="card" style="margin:0 0 var(--spacing-md)">
          <div class="card__title">各任务完成率</div>
          <div class="rate-row"><span style="width:96px">⏰ 早起</span><div class="bar"><i style="width:100%"></i></div><b>100%</b></div>
          <div class="rate-row"><span style="width:96px">📖 阅读</span><div class="bar"><i style="width:80%"></i></div><b>80%</b></div>
          <div class="rate-row"><span style="width:96px">🔤 背单词</span><div class="bar"><i style="width:80%"></i></div><b>80%</b></div>
        </div>
      </div>

      <div data-panel="month" class="hidden">
        <div class="kpis" style="margin:0 0 var(--spacing-md)">
          <div class="kpi"><b>88%</b><span>本月完成率</span></div>
          <div class="kpi"><b>15</b><span>本月打卡（次）</span></div>
          <div class="kpi"><b>0</b><span>本月补卡（次）</span></div>
        </div>
      </div>

      <a class="cell-group" style="display:block;margin:0 0 var(--spacing-md);text-decoration:none" href="badges.html">
        <div class="cell"><span>🏅 我的徽章</span><span class="cell__v">已获得 4 / 9 ›</span></div>
      </a>
    </div>

    <div class="tab-bar">
      <a class="tab-bar__item" href="home.html"><span>🏠</span>首页</a>
      <a class="tab-bar__item active" href="stats.html"><span>📊</span>统计</a>
      <a class="tab-bar__item" href="me.html"><span>👤</span>我的</a>
    </div>
  </div>
  <script src="../assets/interaction.js"></script>
</body>
</html>
