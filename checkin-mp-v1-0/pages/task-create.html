<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>创建任务页 - 打卡小程序 原型</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body>
  <div class="phone-frame" style="padding-bottom:96px">
    <div class="nav-bar">
      <a class="nav-bar__back" href="javascript:history.back()">‹ 返回</a>
      <span class="nav-bar__title">创建任务</span>
      <span style="width:48px"></span>
    </div>

    <div class="field">
      <div class="field__label"><span>任务名称</span><span>8 / 20</span></div>
      <input class="input" value="阅读 30 分钟" readonly>
    </div>

    <div class="field">
      <div class="field__label"><span>选个图标</span></div>
      <div class="icon-pick"><span>⏰</span><span class="on">📖</span><span>🏃</span><span>🔤</span><span>💧</span><span>🧘</span></div>
    </div>

    <div class="field">
      <div class="field__label"><span>打卡频率</span><span>已选 每天</span></div>
      <div class="chips">
        <span class="chip on">每天</span>
        <span class="chip">工作日</span>
        <span class="chip">自定义</span>
      </div>
      <div class="chips" style="margin-top:var(--spacing-sm)">
        <span class="chip">周一</span><span class="chip">周二</span><span class="chip">周三</span><span class="chip">周四</span><span class="chip">周五</span><span class="chip">周六</span><span class="chip">周日</span>
      </div>
    </div>

    <div class="cell-group">
      <div class="cell"><span>开始日期</span><span class="cell__v">今天（11月6日） ›</span></div>
      <div class="cell"><span>每日提醒</span><span class="switch on"></span></div>
      <div class="cell"><span>提醒时间</span><span class="cell__v">21:00 ›</span></div>
    </div>

    <div class="tip">每人最多同时进行 10 个任务，你当前已有 2 个</div>

    <div class="sticky-bottom">
      <div class="btn btn--primary" data-open="#remind">保存任务</div>
    </div>

    <!-- 开启提醒弹窗 -->
    <div class="modal-overlay" id="remind">
      <div class="modal-content">
        <div class="sheet-title">开启打卡提醒？</div>
        <p class="sheet-sub">到 21:00 我们会通过微信服务通知提醒你打卡。<br>微信每次授权只能收到 1 条提醒，打卡后可再次授权。</p>
        <div class="sheet-btns">
          <a class="btn btn--primary" href="home.html">允许提醒</a>
          <a class="btn btn--ghost" href="home.html">暂不提醒</a>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/interaction.js"></script>
</body>
</html>
