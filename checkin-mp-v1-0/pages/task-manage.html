<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>任务管理页 - 打卡小程序 原型</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body>
  <div class="phone-frame" style="padding-bottom:96px">
    <div class="nav-bar">
      <a class="nav-bar__back" href="javascript:history.back()">‹ 返回</a>
      <span class="nav-bar__title">任务管理</span>
      <span style="width:48px"></span>
    </div>

    <div class="section-title"><span class="h2">进行中</span><span class="muted">3 / 10</span></div>

    <a class="task" href="task-edit.html">
      <div class="task__icon">⏰</div>
      <div class="grow"><div class="task__name">早起</div><div class="task__meta">每天 · 06:30 提醒</div></div>
      <span class="cell__v">›</span>
    </a>
    <a class="task" href="task-edit.html">
      <div class="task__icon">📖</div>
      <div class="grow"><div class="task__name">阅读 30 分钟</div><div class="task__meta">每天 · 21:00 提醒</div></div>
      <span class="cell__v">›</span>
    </a>
    <a class="task" href="task-edit.html">
      <div class="task__icon">🔤</div>
      <div class="grow"><div class="task__name">背 20 个单词</div><div class="task__meta">周一至周五 · 22:00 提醒</div></div>
      <span class="cell__v">›</span>
    </a>

    <div class="section-title"><span class="h2">已暂停</span><span class="muted">1</span></div>
    <div class="task task--done">
      <div class="task__icon">🧘</div>
      <div class="grow"><div class="task__name">冥想 10 分钟</div><div class="task__meta">每天 · 已暂停，不再提醒</div></div>
    </div>

    <div class="sticky-bottom">
      <a class="btn btn--primary" href="task-create.html">＋ 新建任务</a>
    </div>
  </div>
  <script src="../assets/interaction.js"></script>
</body>
</html>
